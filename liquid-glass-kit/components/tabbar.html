<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Liquid Glass — Tab Bar (компонент)</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

.dock{position:fixed;left:0;right:0;bottom:calc(var(--bot) + 12px);display:flex;justify-content:center;gap:calc(24*var(--u))}
.matte{border-radius:999px;background:rgba(60,60,60,.62);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);border:0;

.matte::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;filter:blur(.4px);

.lens .gap,.lens .tab.on .gap{stroke:#2b2b2b}
.bar{position:relative;width:calc(843*var(--u));height:calc(190*var(--u));touch-action:none;cursor:grab}
.bar.down{cursor:grabbing}
.base{position:absolute;inset:0}
.fil{position:absolute;left:calc(-60*var(--u));top:calc(-40*var(--u));width:calc(963*var(--u));height:calc(270*var(--u));pointer-events:none;background:rgba(60,60,60,.62);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);clip-path:path('M0 0 Z')}

.gap{stroke:#252525;transition:stroke .25s}
.tab.on .gap{stroke:#474747}
.ico{height:calc(70*var(--u));display:grid;place-items:center}
.ico svg{height:100%;width:auto;display:block}
.av{width:calc(62*var(--u));height:calc(62*var(--u));border-radius:50%;background:#7d8a97 center/cover no-repeat;display:grid;place-items:center;overflow:hidden;transition:box-shadow .25s}

.av.has svg{display:none}
.tab.on .av{box-shadow:0 0 0 calc(3*var(--u)) var(--blue)}
.dock{transform:translateY(calc(var(--kb,0px)*-1))}
.bg{position:fixed;inset:0;overflow:hidden;background:#000;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(30px);opacity:.9}
.bg i:nth-child(1){width:60vw;height:60vw;left:-15vw;top:8vh;background:#3a8bf7}
.bg i:nth-child(2){width:55vw;height:55vw;right:-18vw;top:30vh;background:#ff5a3c}
.bg i:nth-child(3){width:50vw;height:50vw;left:20vw;bottom:-12vh;background:#b44cf0}
.bg p{position:absolute;left:0;right:0;text-align:center;font:700 34px/1 -apple-system,Inter,system-ui,sans-serif;color:rgba(255,255,255,.9)}
.bg p:nth-of-type(1){top:18vh}.bg p:nth-of-type(2){top:42vh}.bg p:nth-of-type(3){top:66vh}
.dock,.view{z-index:2}
</style></head><body>
<!--
  КОМПОНЕНТ: TAB BAR С ЖИДКОЙ КАПЛЕЙ
  Что внутри: стеклянная панель (.base) + капля (.thumb/.lens) + слияние края бара с каплей (.fil).
  Капля тянется пальцем, примагничивается, деформируется (физика — в функции loop внизу).
  Размеры задаются через --u (1u ≈ .46px): бар 843×190u, капля 252×165u, вкладка 273u.
  Чтобы подключить экраны: window.onTabChange = i => { ... } (i = 0,1,2).
-->
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><p>Liquid Glass</p><p>тяни и крути</p><p>Telegram mini app</p></div>
<div class="dock">
<div class="bar" id="bar" style="--x:1;--tx:0;--sx:1;--sy:1;--p:0">
    <div class="matte base" id="base"></div>
    <div class="fil" id="fil"></div>
    <div class="solid"></div>
    <div class="tabs" id="tabs">

        <span>Контакты</span>
      </button>
      <button class="tab on" aria-label="Чаты">
        <span class="ico"><svg viewBox="10 10 80 80"><path fill="currentColor" d="M40.64,17.92 C56.88,17.92 70.04,29.89 70.04,44.65 C70.04,59.41 56.88,71.38 40.64,71.38 C38.15,71.38 35.73,71.09 33.43,70.57 C32.46,70.34 31.21,72.85 26.72,75.36 C23.59,77.12 19.24,76.97 18.51,76.66 C17.32,76.16 19.69,74.82 21.60,71.90 C23.51,68.98 22.72,65.49 21.87,64.87 C15.17,59.97 11.24,53.07 11.24,44.65 C11.24,29.89 24.40,17.92 40.64,17.92 C40.64,17.92 40.64,17.92 40.64,17.92z M68.80,27.35 C80.40,30.93 88.75,40.91 88.75,52.67 C88.75,61.09 84.82,67.99 78.12,72.89 C77.27,73.51 76.48,76.99 78.39,79.92 C80.30,82.84 82.67,84.18 81.48,84.68 C80.75,84.99 76.40,85.14 73.27,83.38 C68.78,80.87 67.53,78.36 66.56,78.58 C64.20,79.12 61.78,79.40 59.35,79.39 C53.85,79.39 48.70,78.02 44.30,75.63 C61.20,73.96 74.48,60.81 74.48,44.65 C74.48,38.23 72.38,32.29 68.80,27.35 C68.80,27.35 68.80,27.35 68.80,27.35z"/></svg></span>
        <span>Чаты</span>
      </button>
      <button class="tab" aria-label="Настройки">
        <span class="ico"><span class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4.2" fill="rgba(255,255,255,.85)"/><path d="M3.5 22c.8-4.6 4.2-7 8.5-7s7.7 2.4 8.5 7z" fill="rgba(255,255,255,.85)"/></svg></span></span>
        <span>Настройки</span>
      </button>
    </div>
    <div class="glass thumb" id="thumb"><div class="lens" id="lens"></div></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" color-interpolation-filters="sRGB"><defs id="defs"></defs></svg>
<script>
const isChromium = /Chrome\//.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
const $ = id => document.getElementById(id);
const surf = x => Math.pow(1 - Math.pow(1 - x, 4), .25);
function profile(T, B, ior, N = 128) {
  const eta = 1 / ior, p = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const x = i / N, y = surf(x), dx = x < 1 ? 1e-4 : -1e-4;
    const d = (surf(x + dx) - y) / dx, m = Math.hypot(d, 1), nx = -d / m, ny = -1 / m;
    const k = 1 - eta * eta * (1 - ny * ny);
    if (k < 0) continue;
    const s = Math.sqrt(k);
    p[i] = -(eta * ny + s) * nx * ((y * B + T) / (eta - (eta * ny + s) * ny));
  }
  return p;
}
const k0 = (x, y, w) => (y * w + x) * 4 + 3; // альфа-канал блика: в центральной строке блика нет
function maps(w, h, r, B, p, mx) {
  const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); return [c, x, x.createImageData(w, h)]; };
  const [c1, x1, i1] = mk(), [c2, x2, i2] = mk(), a = i1.data, b = i2.data;
  const N = p.length, wB = w - 2 * r, hB = h - 2 * r, Bs = B * 2.5, sx = Math.cos(Math.PI / 3), sy = Math.sin(Math.PI / 3);
  for (let i = 0; i < a.length; i += 4) { a[i] = a[i + 1] = 128; a[i + 3] = 255; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const X = x < r ? x - r : x >= w - r ? x - r - wB : 0, Y = y < r ? y - r : y >= h - r ? y - r - hB : 0;
    const d2 = X * X + Y * Y;
    if (d2 > (r + 1) ** 2) continue;
    const d = Math.sqrt(d2);
    if (!d) { b[k0(x, y, w)] = 0; continue; }
    const op = d < r ? 1 : 1 - (d - r), k = (y * w + x) * 4, cs = X / d, sn = Y / d, fs = r - d;
    if (op <= 0) continue;
    if (d2 >= Math.max(r - B, 0) ** 2) {
      const disp = p[Math.min(Math.max(fs / B * N, 0) | 0, N - 1)] || 0;
      a[k] = (128 + (-cs * disp / mx) * 127 * op + .5) | 0;
      a[k + 1] = (128 + (-sn * disp / mx) * 127 * op + .5) | 0;
    }
    if (d2 >= Math.max(r - Bs, 0) ** 2) {
      const dot = Math.abs(cs * sx + (-sn) * sy), edge = Math.sqrt(Math.max(0, 1 - (1 - fs) ** 2)), co = dot * edge, col = (255 * co) | 0;

// Сильное стекло: толстое, высокий IOR, усиленное смещение и блик
function filterFor(el, id) {
  const w = el.offsetWidth, h = el.offsetHeight;
  if (w < 2 || h < 2) return '';

  const mx = Math.max(...Array.from(p, Math.abs)) || 1, [disp, spec] = maps(w, h, r, B, p, mx);
  return `<filter id="${id}" x="0%" y="0%" width="100%" height="100%">
<feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="bl"/>
<feImage href="${disp}" x="0" y="0" width="${w}" height="${h}" result="dm"/>
<feDisplacementMap in="bl" in2="dm" scale="${mx * (soft ? .1 : id === 'lg-thumb' ? .45 : .4)}" xChannelSelector="R" yChannelSelector="G" result="dp"/>
<feColorMatrix in="dp" type="saturate" values="5" result="ds"/>
<feImage href="${spec}" x="0" y="0" width="${w}" height="${h}" result="sl"/>
<feComposite in="ds" in2="sl" operator="in" result="sm"/>
<feComponentTransfer in="sl" result="sf"><feFuncA type="linear" slope="${soft ? 0 : id === 'lg-thumb' ? .22 : 1}"/></feComponentTransfer>
<feBlend in="sm" in2="dp" mode="normal" result="ws"/>
<feBlend in="sf" in2="ws" mode="normal"/></filter>`;
}
const bar = $('bar'), base = $('base'), fil = $('fil'), thumb = $('thumb'), lens = $('lens');
const bdEls = [[base, 'bd-base']], glassEls = [[lens, 'lg-thumb']];
bdEls.forEach(([el]) => el.dataset.soft = '1');
function rebuild() {
  $('defs').innerHTML = glassEls.concat(isChromium ? bdEls : []).map(([el, id]) => filterFor(el, id)).join('');
  glassEls.forEach(([el, id]) => el.style.filter = `url(#${id})`);
  // backdrop-filter: url(#svg) умеет только Chromium; в Safari/WebView iOS остаётся обычное размытие из CSS
  if (isChromium) bdEls.forEach(([el, id]) => { const v = `url(#${id}) blur(4px) saturate(1.8)`; el.style.backdropFilter = v; el.style.webkitBackdropFilter = v; });
}
let rt;
const ro = new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(rebuild, 80); });
glassEls.concat(bdEls).forEach(([el]) => ro.observe(el));
rebuild();

// Переключатель: «каплю» можно таскать туда-сюда, пока палец зажат; при отпускании она примагничивается
const tabs = [...$('tabs').children], tabsEl = $('tabs');
const clone = tabsEl.cloneNode(true); clone.removeAttribute('id'); clone.setAttribute('aria-hidden', 'true');
clone.querySelectorAll('button').forEach(b => b.tabIndex = -1); lens.appendChild(clone);
const cloneTabs = [...clone.children];
let dirv = 1, cur = 1, vel = 0, target = 1, press = 0, pvel = 0, down = false, grab = 0, active = 1;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function highlight(i) { if (i === hi) return; hi = i; [tabs, cloneTabs].forEach(arr => arr.forEach((el, n) => el.classList.toggle('on', n === i))); }

function ptr(e) {
  const rc = tabsEl.getBoundingClientRect(), w = tabs[0].offsetWidth, pad = (rc.width - w * 3) / 2;
  return (e.clientX - rc.left - pad) / w;
}
function place(p, now) {
  const raw = p - .5 - grab;
  target = raw < 0 ? raw * .3 : raw > 2 ? 2 + (raw - 2) * .3 : raw; // сопротивление у краёв
  if (pT) { const dt = Math.max(.008, (now - pT) / 1000); pV += ((raw - pRaw) / dt - pV) * .35; }
  pRaw = raw; pT = now;
  highlight(clamp(Math.round(raw), 0, 2));   // экран не переключаем, пока капля в руке
}
bar.addEventListener('pointerdown', e => {
  bar.setPointerCapture(e.pointerId); down = true; bar.classList.add('down');
  pV = 0; pT = 0;
  const p = ptr(e); grab = Math.abs(p - (cur + .5)) < .5 ? p - (cur + .5) : 0; place(p, e.timeStamp);
});
bar.addEventListener('pointermove', e => { if (down) place(ptr(e), e.timeStamp); });
['pointerup', 'pointercancel'].forEach(n => bar.addEventListener(n, e => {
  if (!down) return; down = false; bar.classList.remove('down');
  if (e.timeStamp - pT > 90) pV = 0;           // палец стоял — инерции нет
  pV = clamp(pV, -9, 9);
  const dest = clamp(Math.round(pRaw + pV * .1), 0, 2); // бросок «перебрасывает» каплю дальше
  target = dest; setActive(dest);
  vel += pV * .22;                              // импульс при отпускании
}));
tabs.forEach((el, n) => el.addEventListener('click', e => { if (e.detail === 0) { target = n; setActive(n); } }));

let last = performance.now();
(function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000 || .016); last = now;
  // пружины: на пальце — мягкое следование, после отпускания — недодемпфированная (с перелётом и покачиванием)
  const k = down ? 210 : 230, c = down ? 22 : 1.6 * Math.sqrt(230), pk = 200, pc = 11;   // после отпускания/тапа — почти критическое демпфирование: едва заметный перелёт (~1.5%)
  const n = 4, h = dt / n;

    pvel += (-pk * (press - (down ? 1 : 0)) - pc * pvel) * h; press += pvel * h;
    lagv += (-180 * (lag - cur) - 2 * Math.sqrt(180) * lagv) * h; lag += lagv * h; // «отстающее» тело капли
  }
  // без зажатия: пока капля едет, она раздувается ровно до краёв бара (297×190 при исходных 273×165)
  const moving = Math.abs(cur - target) > .1 || Math.abs(vel) > .9;
  { // критически задемпфированная пружина: мягкий старт и мягкая остановка, без рывка и перелёта
    // капля «приехала»: толчок наружу — она на миг раздувается чуть шире краёв бара,
    // затем с покачиванием (недодемпфированная пружина) возвращается и даже чуть недотягивает до нормы
    if (wasMoving && !moving && !down) zzv -= 2.4;                  // приземление: капля сплющивается (ниже и шире) и мягко возвращается
    if (!wasMoving && moving) zzv += 1.4;                           // старт: капля «набухает» и плавно оседает

  }

  { const zt = .02 * clamp(Math.abs(vel) / 6, 0, 1) + .04 * press;
    for (let i = 0; i < 4; i++) { zzv += (-170 * (zz - zt) - 1.2 * Math.sqrt(170) * zzv) * (dt / 4); zz += zzv * (dt / 4); }
    zz = clamp(zz, -.3, .3); }
  const g = (mv < 0 && press < .02) ? mv : Math.max(mv, press);
  const st = clamp(Math.abs(vel) * .055, 0, .26) * (down ? 1 : .6);  // растяжение по скорости
  const s = 1 + .05 * g + .06 * press, sy = 1 + .24 * g + .16 * press; // до краёв бара; при зажатии — ещё больше
  bar.style.setProperty('--x', cur.toFixed(4));

    let d = '';

      const FLAT0 = 95, FLAT1 = 748;                                       // прямой участок бара (без скруглённых торцов)
